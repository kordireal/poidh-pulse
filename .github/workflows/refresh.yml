name: refresh-snapshot

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node refresh.mjs
      - name: commit refreshed snapshot
        run: |
          git config user.name "poidh-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh bounty snapshot"
            git push
          fi
